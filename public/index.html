<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Agenda de Capacitación</title>
  <link rel="stylesheet" href="css/styles.css?v=7">
</head>
<body class="login-fondo">
  <form class="login-caja" id="form-login">
    <img class="logo-login" width="150" src="img/logo.png" alt="Coca-Cola FEMSA">
    <h1>Agenda de Capacitación</h1>
    <p class="sub">Acceso para el equipo de Capacitación y Aprendizaje</p>
    <div class="campo" style="margin-top:22px">
      <label for="correo">Correo</label>
      <input id="correo" type="email" autocomplete="username" required>
    </div>
    <div class="campo">
      <label for="clave">Contraseña</label>
      <input id="clave" type="password" autocomplete="current-password" required>
    </div>
    <div id="aviso" class="aviso" style="margin-top:16px;margin-bottom:0"></div>
    <button class="btn" id="btn-entrar" type="submit">Entrar</button>
  </form>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js?v=7"></script>
  <script>
    if (new URLSearchParams(location.search).get("sin_acceso"))
      mostrarAviso("aviso", "error", "Tu usuario no tiene acceso o está desactivado. Habla con el administrador.");
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) location.href = destinoTrasLogin();
    })();

    document.getElementById("form-login").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn-entrar");
      btn.disabled = true;
      btn.textContent = "Entrando…";
      const { error } = await sb.auth.signInWithPassword({
        email: document.getElementById("correo").value.trim(),
        password: document.getElementById("clave").value,
      });
      if (error) {
        mostrarAviso("aviso", "error", "Correo o contraseña incorrectos.");
        btn.disabled = false;
        btn.textContent = "Entrar";
        return;
      }
      location.href = destinoTrasLogin();
    });
  </script>
</body>
</html>
