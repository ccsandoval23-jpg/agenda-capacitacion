<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eventos · Agenda de Capacitación</title>
  <link rel="stylesheet" href="css/styles.css?v=6">
</head>
<body>
  <header id="encabezado"></header>
  <main>
    <div class="cabecera-pagina">
      <div>
        <h1>Eventos</h1>
        <p class="sub">Todas las formaciones del centro de capacitación.</p>
      </div>
      <a class="btn" href="evento-form.html">+ Nuevo evento</a>
    </div>
    <div id="aviso" class="aviso"></div>
    <div class="pestanas" id="pestanas">
      <button data-f="proximos" class="activo">Próximos</button>
      <button data-f="pasados">Pasados</button>
      <button data-f="todos">Todos</button>
    </div>
    <section class="tarjeta"><div class="tabla-scroll" id="lista"></div></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js?v=6"></script>
  <script>
    let eventos = [];
    let filtro = "proximos";

    function pintar() {
      const hoy = hoyISO();
      let lista = eventos;
      if (filtro === "proximos") lista = eventos.filter((e) => e.fecha >= hoy);
      if (filtro === "pasados") lista = eventos.filter((e) => e.fecha < hoy).reverse();
      const cont = document.getElementById("lista");
      if (!lista.length) {
        cont.innerHTML = '<div class="vacio">No hay eventos en esta vista.</div>';
        return;
      }
      cont.innerHTML = `<table><thead><tr><th>Evento</th><th>Fecha</th><th>Sala</th><th>Ocupación</th><th>Espera</th><th>Estado</th><th></th></tr></thead><tbody>` +
        lista.map((e) => `<tr>
          <td><div class="nombre">${esc(e.nombre)}</div><div class="detalle">${esc(e.instructor)}</div></td>
          <td>${formatearFecha(e.fecha)}<div class="detalle">${formatearHora(e.hora_inicio)} – ${formatearHora(e.hora_fin)}</div></td>
          <td>${esc(e.sala)}</td>
          <td>${barraOcupacion(e.inscritos, e.cupo_maximo)}</td>
          <td>${e.espera ? '<span class="etiqueta-estado est-espera">' + e.espera + '</span>' : '—'}</td>
          <td><span class="etiqueta-estado est-${e.estado}">${e.estado === "abierto" ? "Abierto" : "Cerrado"}</span></td>
          <td style="white-space:nowrap"><a class="btn btn-chico" href="inscritos.html?e=${e.id}">Inscritos</a> <a class="btn btn-claro btn-chico" href="evento-form.html?id=${e.id}">Editar</a></td>
        </tr>`).join("") + "</tbody></table>";
    }

    document.getElementById("pestanas").addEventListener("click", (ev) => {
      const b = ev.target.closest("button");
      if (!b) return;
      filtro = b.dataset.f;
      document.querySelectorAll("#pestanas button").forEach((x) => x.classList.toggle("activo", x === b));
      pintar();
    });

    (async () => {
      if (!(await requerirSesion())) return;
      montarEncabezado("eventos");
      try {
        eventos = await cargarEventosConConteos();
        pintar();
      } catch (err) {
        mostrarAviso("aviso", "error", "No se pudieron cargar los eventos: " + err.message);
      }
    })();
  </script>
</body>
</html>
