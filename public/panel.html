<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel · Agenda de Capacitación</title>
  <link rel="stylesheet" href="css/styles.css?v=7">
</head>
<body>
  <header id="encabezado"></header>
  <main>
    <div class="cabecera-pagina">
      <div>
        <h1>Panel resumen</h1>
        <p class="sub">Cupos, lista de espera y asistencia de un vistazo.</p>
      </div>
      <a class="btn" href="evento-form.html">+ Nuevo evento</a>
    </div>
    <div id="aviso" class="aviso"></div>
    <section class="indicadores" id="indicadores"></section>
    <section class="tarjeta" id="sec-headcount" style="display:none;margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px">
        <h2>Headcount y participación</h2>
        <a class="btn btn-claro btn-chico" href="headcount.html">Ver headcount</a>
      </div>
      <div class="indicadores" id="ind-headcount"></div>
      <div class="tabla-scroll" id="hc-areas"></div>
    </section>
    <section class="tarjeta">
      <h2 style="margin-bottom:12px">Próximos eventos</h2>
      <div class="tabla-scroll" id="proximos"></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js?v=9"></script>
  <script>
    // Trae todas las filas de una tabla (Supabase devuelve máximo 1000 por consulta)
    async function traerTodo(tabla, columnas) {
      const filas = [];
      for (let desde = 0; ; desde += 1000) {
        const { data, error } = await sb.from(tabla).select(columnas).range(desde, desde + 999);
        if (error) throw error;
        filas.push(...data);
        if (data.length < 1000) break;
      }
      return filas;
    }

    // Participación = colaboradores activos con al menos una inscripción confirmada en algún evento
    async function pintarHeadcount() {
      try {
        const [hc, po] = await Promise.all([traerTodo("headcount", "correo, area, activo"), traerTodo("postulaciones", "correo, estado")]);
        const activos = hc.filter((h) => h.activo);
        if (!activos.length) return;
        const inscritos = new Set(po.filter((p) => p.estado === "inscrito").map((p) => p.correo.toLowerCase()));
        const participa = (h) => inscritos.has(h.correo.toLowerCase());
        const pct = (n, t) => (t ? Math.round((n / t) * 100) : 0);

        const porArea = {};
        for (const h of activos) {
          const a = (porArea[h.area] ??= { total: 0, part: 0 });
          a.total++;
          if (participa(h)) a.part++;
        }
        const nPart = activos.filter(participa).length;
        document.getElementById("ind-headcount").innerHTML = [
          [activos.length, "Colaboradores activos"],
          [Object.keys(porArea).length, "Áreas"],
          [pct(nPart, activos.length) + "%", `Han participado (${nPart} de ${activos.length})`],
          [activos.length - nPart, "Sin ninguna inscripción"],
        ].map(([v, t]) => `<div class="indicador"><div class="valor">${v}</div><div class="etiqueta">${t}</div></div>`).join("");

        document.getElementById("hc-areas").innerHTML = `<table><thead><tr><th>Área</th><th>Colaboradores</th><th>Participación</th></tr></thead><tbody>` +
          Object.entries(porArea).sort((a, b) => b[1].total - a[1].total || a[0].localeCompare(b[0], "es")).map(([area, v]) => `<tr>
            <td><div class="nombre">${esc(area)}</div></td>
            <td>${v.total}</td>
            <td><div class="barra"><span style="width:${pct(v.part, v.total)}%"></span></div><div class="barra-texto">${v.part} de ${v.total} (${pct(v.part, v.total)}%)</div></td>
          </tr>`).join("") + "</tbody></table>";
        document.getElementById("sec-headcount").style.display = "block";
      } catch (err) {
        // Si el headcount aún no existe, el panel de eventos sigue funcionando
        console.warn("Headcount no disponible:", err.message);
      }
    }

    (async () => {
      if (!(await requerirSesion("eventos_ver"))) return;
      montarEncabezado("panel");
      pintarHeadcount();
      if (!puede("eventos_gestionar")) document.querySelectorAll('a[href="evento-form.html"]').forEach((x) => x.remove());
      try {
        const eventos = await cargarEventosConConteos();
        const hoy = hoyISO();
        const proximos = eventos.filter((e) => e.fecha >= hoy);
        const pasados = eventos.filter((e) => e.fecha <= hoy);

        const cupoTotal = proximos.reduce((s, e) => s + e.cupo_maximo, 0);
        const inscritos = proximos.reduce((s, e) => s + e.inscritos, 0);
        const espera = proximos.reduce((s, e) => s + e.espera, 0);
        const asistio = pasados.reduce((s, e) => s + e.asistio, 0);
        const marcados = pasados.reduce((s, e) => s + e.asistio + e.no_asistio, 0);

        const tarjetas = [
          [proximos.length, "Eventos próximos"],
          [cupoTotal ? Math.round((inscritos / cupoTotal) * 100) + "%" : "—", "Ocupación de cupos"],
          [espera, "En lista de espera"],
          [marcados ? Math.round((asistio / marcados) * 100) + "%" : "—", "Asistencia registrada"],
        ];
        document.getElementById("indicadores").innerHTML = tarjetas
          .map(([v, t]) => `<div class="indicador"><div class="valor">${v}</div><div class="etiqueta">${t}</div></div>`).join("");

        const cont = document.getElementById("proximos");
        if (!proximos.length) {
          cont.innerHTML = '<div class="vacio">No hay eventos próximos. Crea el primero con «Nuevo evento».</div>';
          return;
        }
        cont.innerHTML = `<table><thead><tr><th>Evento</th><th>Fecha</th><th>Sala</th><th>Ocupación</th><th>Espera</th><th></th></tr></thead><tbody>` +
          proximos.slice(0, 8).map((e) => `<tr>
            <td><div class="nombre">${esc(e.nombre)}</div><div class="detalle">${esc(e.instructor)}</div></td>
            <td>${formatearFecha(e.fecha)}<div class="detalle">${formatearHora(e.hora_inicio)} – ${formatearHora(e.hora_fin)}</div></td>
            <td>${esc(e.sala)}</td>
            <td>${barraOcupacion(e.inscritos, e.cupo_maximo)}</td>
            <td>${e.espera ? '<span class="etiqueta-estado est-espera">' + e.espera + '</span>' : '—'}</td>
            <td><a class="btn btn-claro btn-chico" href="inscritos.html?e=${e.id}">Ver inscritos</a></td>
          </tr>`).join("") + "</tbody></table>";
      } catch (err) {
        mostrarAviso("aviso", "error", "No se pudieron cargar los datos: " + err.message);
      }
    })();
  </script>
</body>
</html>
